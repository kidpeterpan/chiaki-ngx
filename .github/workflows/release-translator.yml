name: Release chiaki-ngx translator

# One release with both downloads: the macOS arm64 DMG and the Steam Deck AppImage.
# Push a tag like v0.2.0-translator, or run this workflow by hand. A manual run with
# publish off only builds and keeps the artifacts, which is how to test a change.
on:
  push:
    tags: [ 'v*-translator' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.2.0-translator
        required: true
        type: string
      publish:
        description: Publish the release (off = build and keep the artifacts only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64 DMG
    uses: ./.github/workflows/build-macos.yml

  steamdeck:
    name: Steam Deck AppImage
    uses: ./.github/workflows/build-translator-appimage.yml

  publish:
    name: Publish release
    needs: [macos, steamdeck]
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-translator$ ]] || { echo "unexpected tag: $TAG" >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: chiaki-ngx-macos_arm64-Release
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: chiaki-ngx-translator-x86_64.AppImage
          path: dist

      - name: Name the files and write checksums
        working-directory: dist
        run: |
          mv chiaki-ngx.dmg chiaki-ngx-translator-arm64.dmg
          mv chiaki-ngx.AppImage chiaki-ngx-translator-x86_64.AppImage
          for file in chiaki-ngx-translator-arm64.dmg chiaki-ngx-translator-x86_64.AppImage; do
            sha256sum "$file" > "$file.sha256"
          done
          ls -l

      - name: Create or update the release
        run: |
          files=(dist/chiaki-ngx-translator-arm64.dmg dist/chiaki-ngx-translator-arm64.dmg.sha256
                 dist/chiaki-ngx-translator-x86_64.AppImage dist/chiaki-ngx-translator-x86_64.AppImage.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # an annotated tag's message becomes the notes; otherwise GitHub generates them
            git tag -l --format='%(contents)' "$TAG" > notes.md
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" \
              --title "chiaki-ngx Translator ${TAG#v}" "${notes[@]}"
          fi
