# Fast, credential-free verification for the translator module.
name: Translator tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    name: core (Linux, no ONNX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libsqlite3-dev
      - name: Configure
        run: cmake -S translator_core -B build-core -G Ninja -DTRANS_BUILD_TESTS=ON -DTRANS_ENABLE_ONNXRUNTIME=OFF
      - name: Build
        run: cmake --build build-core -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build-core --output-on-failure

      - name: Shortcut parsing tests
        run: |
          sudo apt-get install -y qt6-base-dev
          g++ -std=c++17 -fPIC -I gui/include             gui/src/translator/shortcuts.cpp gui/tests/translator/TestShortcuts.cpp             $(pkg-config --cflags --libs Qt6Gui Qt6Core)             -o /tmp/translator_shortcut_tests
          /tmp/translator_shortcut_tests

      - name: Timing preference tests
        run: |
          g++ -std=c++17 -I gui/include \
            gui/src/translator/preferences.cpp gui/tests/translator/TestPreferences.cpp \
            -o /tmp/translator_preference_tests
          /tmp/translator_preference_tests

      - name: Overlay geometry tests
        run: |
          g++ -std=c++17 -I gui/include -I translator_core/include \
            gui/src/translator/overlaygeometry.cpp \
            gui/tests/translator/TestOverlayGeometry.cpp \
            -o /tmp/translator_overlay_geometry_tests
          /tmp/translator_overlay_geometry_tests

  core-macos-onnx:
    name: core + OCR (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja onnxruntime
      - name: Configure
        run: |
          cmake -S translator_core -B build-core -G Ninja             -DTRANS_BUILD_TESTS=ON             -DTRANS_ENABLE_ONNXRUNTIME=ON             -DONNXRUNTIME_ROOT="$(brew --prefix onnxruntime)"
      - name: Build
        run: cmake --build build-core -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build-core --output-on-failure
