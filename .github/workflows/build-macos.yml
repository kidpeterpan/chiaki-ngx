name: Build chiaki-ngx macOSX

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-mac_arm64:
    name: Build macOSX arm64 version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install protobuf
        run: |
          pip3 install --user 'protobuf>=5,<6' --break-system-packages
      - name: Install brew dependencies
        run: |
          brew update
          brew install qt@6 ffmpeg pkgconfig opus openssl@3 cmake ninja nasm protobuf@29 speexdsp libplacebo wget python-setuptools json-c miniupnpc libevent onnxruntime
          # OpenSSL 4 headers in the Homebrew prefix would shadow openssl@3; the bundled curl needs 3
          brew unlink openssl@4 || true

      - name: Install sdl2-compat
        run: |
          sudo INSTALL_PREFIX=/usr/local scripts/build-sdl2-compat.sh
          sudo cp /usr/local/lib/pkgconfig/sdl2-compat.pc /usr/local/lib/pkgconfig/sdl2.pc

      - name: Configure chiaki-ngx
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF -DOPENSSL_ROOT_DIR="$(brew --prefix)/opt/openssl@3" -DOPENSSL_INCLUDE_DIR="$(brew --prefix)/opt/openssl@3/include" -DOPENSSL_CRYPTO_LIBRARY="$(brew --prefix)/opt/openssl@3/lib/libcrypto.dylib" -DOPENSSL_SSL_LIBRARY="$(brew --prefix)/opt/openssl@3/lib/libssl.dylib" -DCMAKE_PREFIX_PATH="$(brew --prefix)/opt/openssl@3;$(brew --prefix)/opt/qt@6;$(brew --prefix)/opt/protobuf@29" -DCHIAKI_ENABLE_TRANSLATOR=ON -DTRANS_ENABLE_ONNXRUNTIME=ON -DONNXRUNTIME_ROOT="$(brew --prefix)/opt/onnxruntime"

      - name: Build chiaki-ngx
        run: |
          export CPATH=$(brew --prefix)/opt/ffmpeg/include
          cmake --build build --config Release --clean-first --target chiaki

      - name: Fetch OCR models and full JMdict
        run: scripts/translator/fetch-assets.sh

      - name: Deploy chiaki-ngx
        run: |
          rm -rf chiaki-ngx.app chiaki-ngx.dmg
          cp -a build/gui/chiaki.app chiaki-ngx.app
          mkdir -p chiaki-ngx.app/Contents/Resources/translator/models chiaki-ngx.app/Contents/Resources/translator/dict
          cp assets/models/*.onnx assets/models/japan_dict.txt chiaki-ngx.app/Contents/Resources/translator/models/
          if [[ -f assets/dict/jmdict.db ]]; then
            cp assets/dict/jmdict.db chiaki-ngx.app/Contents/Resources/translator/dict/jmdict.db
          else
            cp assets/dict/jmdict.sample.db chiaki-ngx.app/Contents/Resources/translator/dict/jmdict.db
          fi
          echo "import QtWebEngine; WebEngineView {}" > "$PWD/gui/src/qml/qtwebengine_import.qml"
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ngx.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          mkdir -p chiaki-ngx.app/Contents/Resources/vulkan/icd.d
          wget https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar && tar xf MoltenVK-macos.tar
          cp MoltenVK/MoltenVK/dynamic/dylib/macOS/* chiaki-ngx.app/Contents/Resources/vulkan/icd.d
          $(brew --prefix)/opt/qt@6/bin/macdeployqt chiaki-ngx.app -qmldir="$PWD/gui/src/qml" -libpath=$(brew --prefix)/lib
          if [[ -d chiaki-ngx.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app ]]
          then
            ln -s ../../../../../../../Frameworks chiaki-ngx.app/Contents/Frameworks/QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app/Contents
          fi
          cp /usr/local/lib/libSDL3.dylib chiaki-ngx.app/Contents/MacOS/libSDL3.dylib
          cp /usr/local/lib/libSDL2-2.0.0.dylib chiaki-ngx.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -id @executable_path/libSDL3.dylib chiaki-ngx.app/Contents/MacOS/libSDL3.dylib
          install_name_tool -id @executable_path/libSDL2-2.0.0.dylib chiaki-ngx.app/Contents/MacOS/libSDL2-2.0.0.dylib
          install_name_tool -change /usr/local/lib/libSDL3.dylib @executable_path/libSDL3.dylib chiaki-ngx.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change @rpath/libSDL3.dylib @executable_path/libSDL3.dylib chiaki-ngx.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change /opt/homebrew/lib/libSDL3.dylib @executable_path/libSDL3.dylib chiaki-ngx.app/Contents/MacOS/libSDL2-2.0.0.dylib || true
          install_name_tool -change /usr/local/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ngx.app/Contents/MacOS/chiaki || true
          install_name_tool -change @rpath/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ngx.app/Contents/MacOS/chiaki || true
          install_name_tool -change /opt/homebrew/lib/libSDL2-2.0.0.dylib @executable_path/libSDL2-2.0.0.dylib chiaki-ngx.app/Contents/MacOS/chiaki || true
          ln -s libvulkan.1.dylib chiaki-ngx.app/Contents/Frameworks/vulkan
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ngx.app
          rm -f chiaki-ngx.dmg
          hdiutil create -srcfolder chiaki-ngx.app chiaki-ngx.dmg
          codesign --force --entitlements gui/entitlements.xml --deep --sign - chiaki-ngx.dmg

      - name: Verify app contents and startup
        run: |
          test -s chiaki-ngx.dmg
          translator=chiaki-ngx.app/Contents/Resources/translator
          test -f "$translator/models/japan_PP-OCRv3_rec.onnx"
          # the sample database is far smaller; a full JMdict is tens of MB
          test "$(stat -f%z "$translator/dict/jmdict.db")" -gt 20000000
          find chiaki-ngx.app -name 'libonnxruntime*' | grep -q .
          QT_QPA_PLATFORM=offscreen chiaki-ngx.app/Contents/MacOS/chiaki --help | head -5
          echo "app contents and startup OK"

      - name: Upload chiaki-ngx Artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ngx-macos_arm64-Release
          path: chiaki-ngx.dmg
          if-no-files-found: error
          retention-days: 7
